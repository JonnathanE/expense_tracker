version: "3.9"

services:
    postgres:
        image: postgres:17-alpine
        container_name: expense_tracker_db
        environment:
            POSTGRES_USER: expense_user
            POSTGRES_PASSWORD: expense_pass
            POSTGRES_DB: expense_tracker
        ports:
            - "5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
            - ./backend/migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U expense_user"]
            interval: 5s
            timeout: 5s
            retries: 5

volumes:
    postgres_data:
